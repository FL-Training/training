# ============================================================
# PORTE « EN INDIVIDUEL »
#
# Libellé et périmètre VALIDÉS (document de décisions V2, point 5).
# Deux règles issues de cette décision :
#   - cette offre est DISTINCTE de l'Espace apprenant et ne doit
#     jamais être présentée comme y conduisant ;
#   - elle vise en priorité des professionnels engageant eux-mêmes
#     leur démarche, sans exclure des particuliers.
# Le détail des trois axes reste à écrire par Fabien : rien n'est
# inventé ici (ni contenu de parcours, ni tarif, ni format).
# ============================================================
nom: "En individuel"
ordre: 4
statut: "stub"
picto: "user-round"

seo:
  titre: "Se former ou être accompagné à titre individuel"
  description: "Parcours en ligne, ressources pratiques et accompagnement individuel pour les professionnels qui engagent eux-mêmes leur démarche, et pour les personnes confrontées à une situation de conflit."

entete:
  surtitre: "En individuel"
  titre: "Se former ou être accompagné à titre individuel"
  texte: "Cette rubrique présente les possibilités offertes aux personnes souhaitant se former ou être accompagnées à titre individuel. Elle vise en priorité des professionnels engageant eux-mêmes leur démarche, sans exclure des particuliers souhaitant comprendre et résoudre une situation de conflit personnelle."


# Visuel de la porte sur le carrefour « Formations ».
