# ============================================================
# PAGE D'ACCUEIL
#
# Astuces d'écriture :
#   - [mots entre crochets]  → affichés en vert (couleur accent)
#   - **mots entre étoiles** → affichés en gras
#   - "|" en début de texte  → permet d'écrire sur plusieurs lignes
# ============================================================

seo:
  titre: "Prévention & gestion des conflits en milieu professionnel"
  description: "Formations à la prévention des conflits, à la désescalade verbale et à la gestion des violences au travail, par Fabien Lacombe — ancien policier, formateur certifié."

hero:
  surtitre: "Formation professionnelle · Fabien Lacombe"
  titre: |
    De la tension
    à la [maîtrise].
  texte: "Pacivis Academy accompagne les professionnels exposés à l'agressivité : prévenir les conflits, désamorcer la violence, garder une posture stable — et ne recourir au geste qu'en **dernier recours**."
  bouton_principal: "Découvrir les formations"
  bouton_secondaire: "Notre approche"

# Repères de crédibilité, en lecture éditoriale.
#
# La charte proscrit « l'effet dashboard » et demande qu'un chiffre soit
# accompagné de son contexte : ce ne sont donc plus quatre grands
# nombres alignés, mais trois phrases dont l'élément saillant est mis en
# gras. Chaque fait vient de la biographie validée (« À propos »), vers
# laquelle renvoie le lien — c'est la source.
reperes:
  surtitre: "Repères"
  liste:
    - "**Dix années** d'expérience de terrain au sein de la Police nationale, avec des responsabilités d'encadrement et de management d'effectifs."
    - "**Plus de vingt-cinq ans** de pratique des arts de combat, dont l'enseignement de la boxe française et de l'aïkido."
    - "Formé à la **négociation d'influence**, à la **communication non violente** et aux **techniques d'optimisation du potentiel**."
  lien: "Le parcours complet"

# Pictogrammes disponibles : messages-square, shield-check, plane,
# landmark, building-2, users-round, graduation-cap, user-round
publics:
  surtitre: "Votre situation"
  titre: "Pour celles et ceux qui font face, chaque jour."
  texte: "Entreprises, collectivités, organismes de formation ou professionnels en individuel : entrez par votre situation — la réponse est construite pour votre contexte."
  liste:
    - label: "Entreprise"
      texte: "Préparer vos équipes aux tensions et aux situations dégradées"
      picto: "building-2"
      chemin: "/formations/entreprise"
    - label: "Secteur public"
      texte: "Accompagner les agents et les services exposés"
      picto: "landmark"
      chemin: "/formations/secteur-public"
    - label: "Organisme de formation"
      texte: "Intégrer nos interventions à vos parcours"
      picto: "graduation-cap"
      chemin: "/formations/organismes-de-formation"
    - label: "En individuel"
      texte: "Vous former ou être accompagné à titre individuel"
      picto: "user-round"
      chemin: "/formations/en-individuel"

paxi:
  surtitre: "Produit phare"
  titre: "PAXI — gestion des passagers indisciplinés"
  texte: "Le module de référence pour le transport aérien, déployé en CQP PNC : classification des risques en 4 niveaux, cadre légal complet, désescalade et coordination d'équipage. Pour les écoles, les compagnies — et les navigants."
  bouton: "Découvrir le PAXI"

journal:
  surtitre: "Le Journal Pacivis"
  titre: "Comprendre avant d'agir."
  bouton_tous: "Tous les articles"

# Résumés dérivés du texte validé « Notre approche » (version 7).
# La page /approche porte les formulations complètes de Fabien.
methode:
  surtitre: "La méthode"
  titre: "[ARCA] : quatre piliers qui s'ajustent."
  piliers:
    - numero: "A"
      titre: "Anticiper"
      texte: "Observer l'environnement et les comportements pour repérer suffisamment tôt les signes d'une évolution."
    - numero: "R"
      titre: "Réguler"
      texte: "Préserver ou retrouver une stabilité suffisante lorsque la pression augmente, pour conserver lucidité et capacité de décision."
    - numero: "C"
      titre: "Communiquer"
      texte: "Écouter, formuler une intention claire et poser un cadre adapté — en verbal, paraverbal et non verbal."
    - numero: "A"
      titre: "Agir"
      texte: "Choisir une réponse adaptée au niveau de criticité : graduée, proportionnée et inscrite dans le cadre applicable."
  citation: "ARCA n'est pas une procédure rigide. Ses quatre piliers interagissent et s'ajustent à mesure que la situation évolue."

# Résumé dérivé de la biographie validée (« À propos », V1 consolidée) :
# ne pas y réintroduire de discipline ou de diplôme qui n'y figure pas.
formateur:
  surtitre: "Le fondateur"
  titre: "Le terrain, la pédagogie et la lecture du conflit."
  texte: "Fabien Lacombe s'appuie sur **dix années d'expérience de terrain au sein de la Police nationale**, avec des responsabilités d'encadrement, et sur plus de vingt-cinq ans de pratique des arts de combat — dont l'enseignement de la boxe française et de l'aïkido. Il s'est formé à la négociation d'influence, à la communication non violente et aux techniques d'optimisation du potentiel."
  bouton: "Découvrir son parcours"

appel_final:
  titre: "Parlons de vos équipes."
  texte: "Chaque contexte est différent : les formations sont construites à partir de vos situations réelles, de vos contraintes et de vos objectifs."
  bouton: "Prendre contact"
