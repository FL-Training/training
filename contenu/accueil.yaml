# ============================================================
# PAGE D'ACCUEIL
#
# Astuces d'écriture :
#   - [mots entre crochets]  → affichés en vert (couleur accent)
#   - **mots entre étoiles** → affichés en gras
#   - "|" en début de texte  → permet d'écrire sur plusieurs lignes
#
# ------------------------------------------------------------
# PROVENANCE DES TEXTES — refonte du 26/07/2026
#
# L'accueil est la seule page sans livrable de Fabien. Ses textes sont
# donc COMPOSÉS à partir des documents validés, et chaque bloc porte sa
# source. Deux cas seulement :
#
#   [VALIDÉ]  repris mot pour mot d'un livrable — ne pas retoucher sans
#             reprendre le document d'origine ;
#   [COMPOSÉ] écrit pour l'accueil à partir de ces livrables — à faire
#             valider par Fabien. La liste complète a été remise à
#             Olivier avec la refonte.
#
# Décision d'Olivier et Fabien (26/07) : l'accueil tient le CHAMP LARGE
# du site — « la tension, le conflit ou la crise » — et non l'entrée
# plus étroite par l'agressivité qu'il portait jusqu'ici. Le conflit
# reste la spécialité la plus visible, il n'est plus le seul sujet.
# ============================================================

seo:
  # [COMPOSÉ] Reprend les termes de la signature de marque du pied de
  # page, élargis au champ réel du site.
  titre: "Prévention et gestion des conflits, des tensions et des situations de crise"
  # [COMPOSÉ à partir de « À propos », phrase d'ouverture]
  description: "Pacivis Academy accompagne les professionnels et les organisations lorsque la tension, le conflit ou la crise dégradent les conditions ordinaires de travail, de communication et de décision. Formations pour l'entreprise, le secteur public, les organismes de formation et en individuel."

hero:
  # [COMPOSÉ] Identifie la structure et son fondateur.
  surtitre: "Formation professionnelle · Fabien Lacombe"
  # [COMPOSÉ — 26/07, demande de Fabien]
  #
  # « De la tension à la maîtrise » était une accroche : belle, mais
  # elle ne disait pas ce que Pacivis Academy propose. Le titre annonce
  # maintenant l'offre en une phrase — le verbe (former), le public
  # (les professionnels) et l'objet (tensions, conflits, crise) —, ce
  # qui sert aussi le référencement : ce sont les termes recherchés.
  #
  # La signature de marque n'est pas perdue : elle reste au pied de page
  # et sur le filigrane du logo.
  #
  # Écrit d'un seul tenant, sans retours forcés : le titre se répartit
  # selon la largeur disponible. Des coupures écrites en dur tenaient
  # sur grand écran et découpaient la phrase n'importe où sur un
  # téléphone.
  titre: "Former les professionnels à [agir] face aux tensions, aux conflits et aux crises."
  # [VALIDÉ — « À propos », phrase d'ouverture, mot pour mot]
  texte: "Pacivis Academy est une structure indépendante de formation professionnelle qui accompagne les professionnels et les organisations lorsque **la tension, le conflit ou la crise** dégradent les conditions ordinaires de travail, de communication et de décision."
  bouton_principal: "Découvrir les formations"
  bouton_secondaire: "Notre approche"

# Pictogrammes disponibles : messages-square, shield-check, plane,
# landmark, building-2, users-round, graduation-cap, user-round
publics:
  # [VALIDÉ — page « Formations », surtitre, titre et texte mot pour mot]
  surtitre: "Votre situation"
  titre: "Des interventions construites à partir de vos situations réelles."
  texte: "Pacivis Academy intervient auprès des organisations comme des professionnels engageant eux-mêmes leur démarche. Choisissez l'entrée qui correspond à votre situation."
  # Les quatre secteurs auxquels l'activité s'adresse — nom et
  # pictogramme, rien de plus. Décision du 26/07 : l'accueil montre à
  # qui Pacivis Academy s'adresse, la rubrique « Formations » explique.
  # Les phrases de situation ont donc été retirées d'ici ; elles vivent
  # sur chaque page de porte.
  liste:
    - label: "Entreprise"
      picto: "building-2"
    - label: "Secteur public"
      picto: "landmark"
    - label: "Organisme de formation"
      picto: "graduation-cap"
    - label: "En individuel"
      picto: "user-round"
  bouton: "Voir les formations"

# L'annonce de la méthode, et rien de plus : les quatre piliers et leurs
# schémas ont été retirés de l'accueil le 26/07 — ils vivent sur « Notre
# approche », que le bouton ci-dessous atteint.
methode:
  surtitre: "La méthode"
  # [VALIDÉ — « Notre approche », titre de la section méthode]
  titre: "[ARCA] : la méthode Pacivis Academy"
  # [VALIDÉ — « Notre approche », phrase d'introduction de la méthode]
  intro: "La méthode ARCA structure cette approche autour de quatre piliers : anticiper, réguler, communiquer et agir. Ils peuvent être travaillés ensemble ou de façon ciblée, selon les besoins, les situations et les responsabilités des professionnels concernés."
  bouton: "La méthode en détail"

# Encart PAXI de la page d'accueil.
# [VALIDÉ — livrable PAXI, section « Encart à placer sur la page
# d'accueil », mot pour mot]. L'accueil est l'un des trois seuls points
# d'accès prévus vers PAXI, avec « Entreprises » et « Organismes de
# formation ».
paxi:
  surtitre: "Formation PAXI"
  titre: "PAXI — Prévenir et gérer les comportements de passagers indisciplinés"
  texte: "La formation PAXI prépare les pilotes, les personnels navigants commerciaux et les personnels au sol à développer leur vigilance situationnelle, gérer le conflit par la communication, coordonner l'action et agir de manière adaptée."
  bouton: "Découvrir la formation PAXI"

journal:
  # [VALIDÉ — page « Le Journal », surtitre et titre]
  surtitre: "Le Journal Pacivis"
  titre: "Comprendre avant d'agir."
  # [VALIDÉ — page « Le Journal », chapô]
  texte: "Méthodes, repères, retours de terrain et points de vue : des articles de fond pour celles et ceux qui font face au conflit dans leur métier."
  bouton_tous: "Tous les articles"

appel_final:
  # [COMPOSÉ, retenu par Fabien le 26/07] « Parlons de vos équipes »
  # excluait la porte « En individuel », qui n'en est pas une.
  titre: "Parlons de vos besoins."
  texte: "Chaque contexte est différent : les formations sont construites à partir de vos situations réelles, de vos contraintes et de vos objectifs."
  bouton: "Prendre contact"
