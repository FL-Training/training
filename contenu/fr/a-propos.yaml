seo:
  titre: "À propos — Pacivis Academy"
  description: "Pacivis Academy, structure indépendante de formation professionnelle, accompagne les professionnels et les organisations lorsque la tension, le conflit ou la crise dégradent les conditions de travail, de communication et de décision."

entete:
  surtitre: "Qui sommes nous"
  titre: "À propos de Pacivis Academy"
  texte: "Pacivis Academy est une structure indépendante de formation professionnelle qui accompagne les professionnels et les organisations lorsque la tension, le conflit ou la crise dégradent les conditions ordinaires de travail, de communication et de décision."

intro:
  - "Sa mission est d'aider les professionnels à mieux observer, décider, communiquer et agir lorsque la tension, le conflit ou la crise rendent les situations plus difficiles à lire et à maîtriser."
  - "Nous nous adressons à celles et ceux qui sont directement exposés à ces situations, mais aussi aux organisations qui doivent les anticiper, les encadrer ou en assumer les effets : entreprises, acteurs du secteur public, organismes de formation, équipes de direction, managers, responsables RH, responsables formation et acteurs de la prévention."
  - "Pacivis Academy travaille sur les situations dégradées et les contextes de crise. Dans ce champ, le conflit occupe une place particulière : il est souvent la forme la plus présente, la plus concrète et la plus immédiatement perceptible de la dégradation d'une situation."
  - "Ces situations ont un coût pour les organisations. Lorsqu'elles sont mal anticipées ou mal régulées, elles ne produisent pas seulement un inconfort relationnel : elles fragilisent la confiance, mobilisent l'attention des responsables, ralentissent la décision et peuvent désorganiser durablement l'activité."
  - "Pacivis Academy intervient à cet endroit précis : là où les tensions humaines, si elles ne sont pas préparées, peuvent produire des effets concrets sur la sécurité, la coopération, la décision et la continuité de l'activité."

fondateur:
  surtitre: "Le fondateur"
  titre: "Fabien Lacombe"
  paragraphes:
    - "Fondateur de Pacivis Academy, Fabien Lacombe développe depuis plusieurs années un travail de formation consacré aux situations de tension, de conflit et de crise."
    - "Son parcours s'appuie d'abord sur dix années d'expérience de terrain au sein de la Police nationale, avec des responsabilités d'encadrement et de management d'effectifs dans des contextes où la décision, la coordination, la gestion des risques et la sécurisation des interactions sont déterminantes."
    - "Il s'est également formé à la négociation d'influence, à la communication non violente et aux techniques d'optimisation du potentiel. Ces apports ont nourri sa manière d'aborder les situations sous pression et les situations conflictuelles, en les reliant à la fois aux comportements, aux perceptions, à la relation et à la capacité d'action."
    - "Cette trajectoire relie l'expérience opérationnelle, la formation professionnelle et la compréhension des dynamiques conflictuelles. Elle lui permet de travailler les situations dégradées en articulant techniques professionnelles, procédures, intelligence émotionnelle et régulation physiologique, afin de préparer des réponses plus adaptées lorsque la situation se tend, se dégrade ou devient critique."
    - "Plus de vingt-cinq ans de pratique des arts de combat, avec l'enseignement de la boxe française et de l'aïkido, renforcent cette lecture professionnelle. Cette expérience donne un appui concret pour travailler la distance juste, la transformation du rapport de force, l'engagement et la stabilité."
    - "Fabien conçoit et anime des formations expérientielles, dans lesquelles la pratique occupe une place centrale. Des apports théoriques ciblés viennent soutenir cette expérience, pour donner aux participants des repères clairs sur ce qu'ils vivent, observent et peuvent ajuster en situation."

engagement:
  surtitre: "Notre engagement"
  titre: "Se préparer sérieusement aux moments où tout se dégrade."
  paragraphes:
    - "Pacivis Academy ne promet pas de réponses toutes faites à des situations qui, par nature, restent instables."
    - "Notre engagement est d'aider les professionnels et les organisations à se préparer plus sérieusement aux moments où les relations, les décisions et l'activité se dégradent ou deviennent critiques."
    - "Il s'agit de permettre une réponse plus claire, plus stable et plus ajustée lorsque la pression augmente, que le conflit s'installe ou que la situation menace de sortir de son cours ordinaire."
  bouton_contact: "Prendre contact"
  bouton_linkedin: "Profil LinkedIn"
