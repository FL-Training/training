lance: false
url_skool: ""

seo:
  titre: "Espace apprenant"
  description: "L'espace apprenant Pacivis Academy, en préparation : suivi des parcours, accès aux ressources et partage de retours d'expérience."

entete:
  surtitre: "Espace apprenant"
  titre: "Un espace en préparation"
  texte: "L'espace apprenant Pacivis Academy n'est pas encore ouvert.\n\nIl est conçu comme un espace de continuité pour accompagner les parcours de formation au-delà de la seule séance : retrouver les informations utiles, accéder aux ressources transmises, suivre les formations engagées et, à terme, faciliter les échanges autour des situations rencontrées.\n\nCet espace pourra concerner les apprenants, les entreprises, les collectivités et les organismes de formation accompagnés par Pacivis Academy."

contenu:
  titre: "Ce qu'il proposera"
  liste:
    - titre: "Suivre les parcours"
      texte: "Retrouver les formations engagées, les étapes prévues et les informations utiles au bon déroulement du parcours."
    - titre: "Accéder aux ressources"
      texte: "Centraliser les supports, documents et contenus complémentaires transmis dans le cadre des formations."
    - titre: "Partager des retours d'expérience"
      texte: "À terme, l'espace apprenant pourra aussi devenir un lieu d'échange autour des situations vécues : tensions, conflits, difficultés de communication, résolutions trouvées, apprentissages tirés du terrain.\n\nL'objectif sera de faire vivre une communauté de pratique, dans un cadre adapté, pour permettre aux participants de partager des expériences utiles, de questionner leurs situations et de prolonger les apprentissages au-delà de la formation."
    - titre: "Garder le lien avec Pacivis Academy"
      texte: "Disposer d'un point d'accès clair pour retrouver les informations pratiques et faciliter les échanges liés aux actions de formation."

statut:
  titre: "En attendant son ouverture"
  texte: "L'espace apprenant est en cours de préparation.\n\nPour toute question sur une formation, un parcours en cours, un besoin d'accompagnement ou un projet à construire, vous pouvez prendre contact directement avec Pacivis Academy."
  bouton_contact: "Contacter Pacivis Academy"
  bouton_acces: "Accéder à l'espace apprenant"
