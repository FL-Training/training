seo:
  titre: "PAXI — passagers indisciplinés : prévenir et gérer"
  description: "Formation PAXI pour pilotes, personnels navigants et personnels au sol : qualifier la situation, communiquer, coordonner l'action. Conforme EASA et IOSA."

entete:
  surtitre: "PAXI"
  titre: "Préparer les professionnels de l'aérien et de l'aéroportuaire à prévenir et gérer les comportements perturbateurs et les passagers indisciplinés"
  texte: "Une interaction difficile avec un passager peut affecter la relation, le déroulement des opérations et, dans les situations les plus sérieuses, la sécurité.\n\nLa formation PAXI prépare les professionnels à qualifier la situation, maintenir leurs capacités sous pression, adapter leur communication et coordonner leur action. La formation repose sur un socle commun, adapté aux métiers concernés, aux situations rencontrées et aux procédures applicables."

# Encart visuel distinct, à placer AVANT le programme commun — consigne
# explicite de Fabien : ne pas le fondre dans le corps du texte.
conformite:
  titre: "Conformité EASA et IOSA"
  texte: "La formation PAXI est conforme aux exigences EASA et aux standards IOSA applicables."

programme:
  titre: "Un programme commun en cinq blocs"
  liste:
    - titre: "Comprendre et qualifier la situation"
      texte: "Identifier les comportements perturbateurs, apprécier le niveau de risque, connaître le cadre légal et réglementaire et proportionner la réponse."
    - titre: "Développer sa vigilance situationnelle"
      texte: "Observer les comportements, le contexte et la dynamique de l'interaction."
    - titre: "Gérer le stress et les émotions"
      texte: "Comprendre les effets du stress sur la perception, la communication, la décision et l'action. Mobiliser des techniques permettant de rester disponible et de conserver une réponse professionnelle sous pression."
    - titre: "Prévenir et gérer le conflit par la communication"
      texte: "Adapter sa posture et sa communication, dans leurs dimensions verbale, paraverbale et non verbale. Mobiliser une boîte à outils associant écoute, reformulation, cadrage et techniques de négociation et d'influence afin d'obtenir l'adhésion, sans transiger sur les règles de sécurité."
    - titre: "Coordonner l'action et agir"
      texte: "Partager rapidement l'information utile, employer un vocabulaire commun, répartir les rôles et maintenir une représentation collective de la situation. Mettre en œuvre une réponse coordonnée et proportionnée lorsque la situation exige une intervention."

declinaisons:
  titre: "Deux déclinaisons selon les métiers concernés"
  liste:
    - titre: "Pilotes et Personnels Navigants Commerciaux"
      paragraphes:
        - "Dans l'environnement du vol, une situation impliquant un passager peut engager simultanément la relation en cabine, la coordination de l'équipage, le déroulement des opérations et la sécurité. La formation PAXI prépare les pilotes et les personnels navigants commerciaux à partager une lecture commune de la situation, apprécier le niveau de risque, coordonner leurs décisions et leurs actions et agir dans le cadre de leurs responsabilités respectives."
        - "Les situations travaillées sont adaptées aux réalités du bord, aux procédures de la compagnie et aux rôles respectifs de la cabine et du poste de pilotage. Elles sont nourries par les retours d'expérience de professionnels du secteur et évoluent dans une logique d'amélioration continue."

    - titre: "Personnels au sol"
      paragraphes:
        - "Les personnels au sol interviennent dans des espaces où se concentrent attente, contraintes opérationnelles, incompréhensions et frustrations. Les situations peuvent survenir lors de l'accueil, de l'enregistrement, de l'embarquement, de l'assistance aux passagers ou du traitement des bagages et des irrégularités."
        - "Les contenus sont adaptés aux responsabilités propres à chaque fonction. Les mises en situation reprennent les contraintes rencontrées, les procédures à appliquer et les relais que l'agent peut mobiliser."

pedagogie:
  titre: "Une pédagogie construite à partir des situations de travail"
  paragraphes:
    - "La formation PAXI alterne des apports théoriques ciblés, des analyses de situations, des exercices d'observation, des entraînements à la communication et des mises en situation. Les participants travaillent à partir de cas proches de leur activité afin de relier les connaissances aux décisions et aux comportements attendus sur le terrain."
    - "Les exercices permettent d'expérimenter différentes réponses et d'en observer les effets. Ils sont accompagnés de débriefings structurés favorisant l'analyse, la prise de recul et la transposition aux situations professionnelles."
    - "La durée, le niveau d'approfondissement et la place accordée à chaque séquence sont définis en fonction des objectifs, des métiers concernés et des contraintes du parcours dans lequel la formation s'inscrit."

adaptables:
  titre: "Des contenus adaptables aux exigences opérationnelles et réglementaires"
  liste:
    - titre: "Cadre, procédures et traçabilité"
      texte: "Le socle de la formation PAXI peut être complété par les éléments réglementaires, les procédures internes et les modalités de signalement correspondant au contexte d'intervention. Pour les pilotes et les personnels navigants commerciaux, les contenus peuvent être adaptés au syllabus de l'OM-D et intégrer les procédures de la compagnie, notamment en matière de refus de transport, de coordination entre la cabine et le poste de pilotage et de traçabilité des incidents."
    - titre: "Techniques de protection, intervention coordonnée et utilisation d'un kit d'intervention"
      texte: "Lorsque les responsabilités exercées et le périmètre de la mission le justifient, la formation peut intégrer des contenus consacrés au maintien de la distance, à la protection personnelle, à l'intervention coordonnée et à l'utilisation d'équipements dédiés. Ces contenus ne sont pas systématiques : ils sont définis avec l'organisation concernée selon les fonctions des participants, les procédures en vigueur et les autorisations applicables."

cta:
  texte: "Échangeons sur les métiers concernés, les situations rencontrées et les exigences opérationnelles et réglementaires afin de définir ensemble le format le plus pertinent."
  bouton: "Échanger sur votre besoin"
