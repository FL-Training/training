# ============================================================
# GÉNÉRÉ — ne pas modifier à la main.
#
# Ce fichier est produit par outils/generer-config-sveltia.mjs :
#
#   npm run cms:config
#
# Les listes de choix (flux, labels) viennent de src/lib/flux.ts et
# src/lib/labels.ts — les mêmes listes que la validation au build.
# La cohérence éditeur ↔ site est vérifiée par npm run test:cms.
# ============================================================
backend:
  name: github
  repo: FL-Training/training
  branch: main
media_folder: public
public_folder: /
i18n:
  structure: multiple_folders
  locales:
    - fr
    - en
  default_locale: fr
slug:
  encoding: ascii
  clean_accents: true
editor:
  preview: false
collections:
  - name: pages
    label: Pages du site
    i18n: true
    editor:
      preview: false
    files:
      - i18n: true
        name: accueil
        label: Accueil
        file: contenu/{{locale}}/accueil.yaml
        fields:
          - name: seo
            label: Référencement (SEO)
            widget: object
            i18n: true
            fields:
              - name: titre
                label: Titre (onglet + Google)
                widget: string
                i18n: true
              - name: description
                label: Description (résumé affiché par Google)
                widget: text
                i18n: true
          - name: hero
            label: Bandeau d'ouverture (hero)
            widget: object
            i18n: true
            fields:
              - name: surtitre
                label: Surtitre
                widget: string
                i18n: true
              - name: titre
                label: Titre principal
                widget: text
                i18n: true
              - name: texte
                label: Texte
                widget: text
                i18n: true
              - name: bouton_principal
                label: Bouton principal
                widget: string
                i18n: true
              - name: bouton_secondaire
                label: Bouton secondaire
                widget: string
                i18n: true
          - name: publics
            label: Bloc « Votre situation »
            widget: object
            i18n: true
            fields:
              - name: surtitre
                label: Surtitre
                widget: string
                i18n: true
              - name: titre
                label: Titre
                widget: string
                i18n: true
                hint: >-
                  Repris mot pour mot de la page « Formations » — ne pas reformuler sans reprendre
                  le livrable.
              - name: texte
                label: Texte
                widget: text
                i18n: true
                hint: Repris mot pour mot de la page « Formations ».
              - name: liste
                label: Les quatre secteurs
                widget: list
                i18n: true
                min: 1
                fields:
                  - name: label
                    label: Nom du secteur
                    widget: string
                    i18n: true
                  - name: picto
                    label: Pictogramme
                    widget: string
                    i18n: duplicate
                    hint: Nom du picto (voir la liste dans LISEZMOI.md)
                hint: >-
                  Nom et pictogramme seulement : l'accueil dit à qui l'activité s'adresse, la
                  rubrique « Formations » explique. Le damier entier mène à cette rubrique.
                summary: "{{fields.label}}"
              - name: bouton
                label: Bouton vers la rubrique Formations
                widget: string
                i18n: true
          - name: paxi
            label: Bloc PAXI
            widget: object
            i18n: true
            fields:
              - name: surtitre
                label: Surtitre
                widget: string
                i18n: true
              - name: titre
                label: Titre
                widget: string
                i18n: true
              - name: texte
                label: Texte
                widget: text
                i18n: true
              - name: bouton
                label: Bouton
                widget: string
                i18n: true
          - name: journal
            label: Bloc Journal
            widget: object
            i18n: true
            fields:
              - name: surtitre
                label: Surtitre
                widget: string
                i18n: true
              - name: titre
                label: Titre
                widget: string
                i18n: true
              - name: texte
                label: Chapô
                widget: text
                i18n: true
                hint: Repris du haut de la page « Le Journal ».
              - name: bouton_tous
                label: Bouton « Tous les articles »
                widget: string
                i18n: true
          - name: methode
            label: Bloc méthode
            widget: object
            i18n: true
