              - name: surtitre
                label: Surtitre
                widget: string
                i18n: true
              - name: titre
                label: Titre
                widget: string
                i18n: true
                hint: Repris de « Notre approche ». Le mot entre [crochets] s'affiche en vert.
              - name: intro
                label: Teaser
                widget: text
                i18n: true
                hint: Repris mot pour mot de l'introduction de la méthode, sur « Notre approche ».
              - name: bouton
                label: Bouton vers « Notre approche »
                widget: string
                i18n: true
            hint: >-
              L'accueil annonce ARCA, il ne le déroule pas : les quatre piliers vivent sur « Notre
              approche ».
          - name: appel_final
            label: Appel final
            widget: object
            i18n: true
            fields:
              - name: titre
                label: Titre
                widget: string
                i18n: true
              - name: texte
