# Code release: pushing a tag v* deploys production. Thin trigger — the
# shared logic lives in deployer-production.yml, which converges production
# to "newest v* tag + latest contenu/ from main" whatever the trigger.
# Ordinary commits on main only ever produce protected preview deployments.
name: Release production

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deployer:
    uses: ./.github/workflows/deployer-production.yml
    permissions:
      contents: write
