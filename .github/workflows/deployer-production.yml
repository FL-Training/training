# Shared production deployment — called by release.yml (tag push) and
# contenu.yml (content push on main).
#
# Invariant: production = code of the newest v* tag + latest contenu/ from
# main. Every run CONVERGES to that target state regardless of what
# triggered it. This matters because GitHub keeps only ONE pending run per
# concurrency group: a queued release can be evicted by a newer content
# run — harmless here, since the surviving run also promotes the newest
# tag. Runs are serialized; whichever executes last lands the right state.
#
# Known failure mode: content on main that depends on code newer than the
# last release (e.g. a field added to a schema in an unreleased commit)
# fails the validation here — the run turns red, production keeps its
# current state, and the next release resolves it.
name: Déployer production

on:
  workflow_call:

permissions:
  contents: write

jobs:
  converger:
    runs-on: ubuntu-latest
    concurrency:
      group: release-production
      cancel-in-progress: false
    steps:
      - name: Checkout (all branches and tags)
        uses: actions/checkout@v4
        with:
          # Full history: the newest tag, origin/main and origin/production
          # are all needed, and the branch push must never be shallow.
          fetch-depth: 0

      # Resolve the target state at EXECUTION time (not trigger time):
      # newest v* tag's code, main's current contenu/. The rm+checkout+add
      # dance (instead of a bare checkout) also propagates file deletions.
      # To roll back a release, cut a NEW higher tag on the old commit (or
      # use Vercel's instant rollback) — re-pushing an old tag is a no-op.
      - name: Resolve target state (newest tag + main content)
        id: cible
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "::notice::Aucun tag v* — rien n'est encore releasé, production inchangée."
            echo "deployer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --quiet "$latest"
          git rm -rq -- contenu
          git checkout origin/main -- contenu
          git add -A -- contenu
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1 \
             && git diff --quiet origin/production; then
            echo "::notice::production est déjà à l'état cible ($latest + contenu de main)."
            echo "deployer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deployer=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      # Node 24 LTS ships npm 11, matching the npm that generated
      # package-lock.json — npm 10 (Node 22) rejects this lockfile.
      - name: Setup Node
        if: steps.cible.outputs.deployer == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Validate the exact tree being promoted: the CI workflow only runs
      # on main/PRs and may still be running (or have failed) when a tag
      # is pushed, and Vercel's own build does not type-check. The zod
      # content schemas run inside the build.
      - name: Install dependencies
        if: steps.cible.outputs.deployer == 'true'
        run: npm ci

      - name: Type check (astro check)
        if: steps.cible.outputs.deployer == 'true'
        run: npm run check

      - name: Build Astro site
        if: steps.cible.outputs.deployer == 'true'
        run: npm run build

      # `production` only ever moves through this workflow, so a forced
      # update is safe — it also covers a hotfix tag cut from an older
      # commit, where a fast-forward would be rejected. Vercel has
      # `production` as its Production Branch: this push is what triggers
      # the public deployment.
      - name: Push production
        if: steps.cible.outputs.deployer == 'true'
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "production: ${{ steps.cible.outputs.tag }} + contenu de main"
          fi
          git push --force origin HEAD:refs/heads/production
