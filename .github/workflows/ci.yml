# Quality gate: every push to main (and every PR) must type-check, build,
# and keep its styles across client-side navigation. This gate is what
# keeps a broken content edit (e.g. a malformed YAML saved through
# Keystatic) — or a style silently lost when the router swaps a page —
# visibly red on GitHub before anyone ships it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 LTS ships npm 11, matching the npm that generated
      # package-lock.json — npm 10 (Node 22) rejects this lockfile.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      # L'éditeur de contenu doit connaître tous les champs que le site
      # exige : un champ requis absent de la config Sveltia serait
      # effacé du fichier dès que Fabien enregistre la page, et le build
      # suivant refuserait le contenu.
      - name: Cohérence éditeur ↔ schémas
        run: npm run test:cms

      # PUBLIC_CONVEX_URL is intentionally absent: the build must succeed
      # without it (forms fall back to LinkedIn), and this also validates
      # every /contenu file against the zod schemas. The build must run
      # before the contract tests because the 404-page contracts inspect
      # the generated dist/ artifact.
      - name: Build Astro site
        run: npm run build

      # Les contrats de contenu, un par un : les tolérances (aucune
      # saisie de l'éditeur ne bloque la publication), les gardes (le
      # vide interdit reste interdit), les langues et leur arborescence,
      # la structure de la config Sveltia, href() et l'artefact 404.
      - name: Tests unitaires des contrats
        run: npm run test:unitaires

      # A scoped style dropped during a client-side page swap is
      # invisible when reloading and only shows up while navigating, so
      # it survives review. This runs the real build in a browser and
      # compares both ways of reaching a page.
      - name: Install Chromium for the style test
        run: npx playwright install --with-deps chromium

      - name: Styles survive navigation
        run: npm run test:styles

      # Référencement : les défauts qui coûtent le plus cher sont
      # relationnels (une canonique qui contredit le sitemap, un hreflang
      # sans réciproque) et n'apparaissent qu'en comparant les pages entre
      # elles — ce que ni le build ni une revue page à page ne font.
      - name: Cohérence de référencement
        run: npm run audit:seo

      # Accessibilité : axe-core sur chaque page du build et sur les états
      # qui n'existent qu'après interaction (panneau mobile ouvert,
      # sous-menu survolé), plus les contrôles qu'axe ne fait pas —
      # lien d'évitement, focus visible, cibles tactiles, zoom 200 %.
      - name: Accessibilité WCAG 2.1 AA
        run: npm run audit:a11y
