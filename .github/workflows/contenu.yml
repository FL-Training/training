# Content publication — the CMS half of the pipeline: a push to main that
# touches contenu/ (a Keystatic save, or a manual edit on GitHub) goes to
# the public site on its own, without waiting for a code release. Thin
# trigger — the shared logic lives in deployer-production.yml, which
# converges production to "newest v* tag + latest contenu/ from main".
# Before the first release (no v* tag yet), the shared workflow no-ops.
name: Publication du contenu

on:
  push:
    branches: [main]
    paths:
      - "contenu/**"
      - "!contenu/LISEZMOI.md"

permissions:
  contents: write

jobs:
  deployer:
    uses: ./.github/workflows/deployer-production.yml
    permissions:
      contents: write
